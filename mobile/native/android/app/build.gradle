apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    //
    // RELAY: EMPTY on purpose — the milestone debug APK is installed on
    // phones with no Metro dev server anywhere near them ("Unable to load
    // script" red screen otherwise). Bundling the JS into debug makes the
    // CI artifact standalone; bridgeless RN falls back from Metro to the
    // bundled assets automatically.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.relaynative"
    defaultConfig {
        applicationId "org.yourchat.relay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "3.1.0"
    }
    // ── RELEASE SIGNING (v2.99.52) ──────────────────────────────────────────
    // The release build type used to fall back to `signingConfigs.debug` — the
    // React Native template default, and a real footgun here for two reasons:
    //
    //   1. A local or CI `assembleRelease` produced a DEBUG-SIGNED artifact that
    //      looks shippable. Nothing about the file says "do not upload this".
    //   2. native-rn.yml signs the AAB afterwards with the real upload key, but
    //      `jarsigner` ADDS a signature rather than replacing one — so the bundle
    //      handed to Play carried TWO signers, which Play can reject.
    //
    // Now: sign with a real keystore when one is configured (env vars, which is
    // how CI would pass it, or gradle properties for a local release build), and
    // otherwise leave the release UNSIGNED. An unsigned artifact cannot be
    // mistaken for a store build — that is the point — and the CI `jarsigner`
    // step then produces a single, correct signature.
    //
    // NEVER point `release` at signingConfigs.debug again.
    def ksPath = System.getenv("RELAY_KEYSTORE_PATH") ?: project.findProperty("RELAY_KEYSTORE_PATH")
    def ksPassword = System.getenv("RELAY_KEYSTORE_PASSWORD") ?: project.findProperty("RELAY_KEYSTORE_PASSWORD")
    def ksAlias = System.getenv("RELAY_KEY_ALIAS") ?: project.findProperty("RELAY_KEY_ALIAS")
    // Groovy `?:` treats "" as falsy, so an EMPTY key-password secret correctly
    // falls through to the store password. Keep that: a PKCS12 keystore (what
    // `keytool -genkeypair` produces by default on JDK 9+, and what the README's
    // generation command makes) REQUIRES the key and store passwords to be equal.
    def ksKeyPassword = System.getenv("RELAY_KEY_PASSWORD") ?: project.findProperty("RELAY_KEY_PASSWORD") ?: ksPassword

    // `file()` resolves a RELATIVE path against THIS MODULE's directory
    // (mobile/native/android/app), not the repo root and not the workflow's
    // working-directory. A natural-looking relative value therefore misses,
    // .exists() goes false, and the build goes quietly UNSIGNED — a green log
    // with an unshippable artifact. Refuse the ambiguity outright.
    def ksFile = ksPath?.toString() ? new File(ksPath.toString()) : null
    if (ksFile != null && !ksFile.isAbsolute()) {
        throw new GradleException("RELAY_KEYSTORE_PATH must be an ABSOLUTE path (got '${ksPath}')")
    }
    // `length() > 0` is load-bearing, not belt-and-braces: `base64 -d` of an
    // EMPTY string exits 0 and leaves a 0-BYTE file (verified), and exists() is
    // true for one. That is exactly what an absent CI secret decodes to, so
    // exists() alone would flip this true and fail every secretless build while
    // Gradle tried to load a garbage keystore.
    def hasUploadKeystore = ksPassword?.toString() && ksAlias?.toString() &&
            ksFile != null && ksFile.isFile() && ksFile.length() > 0

    // Gradle is now the ONLY signer (v2.99.55 — jarsigner used to add a second
    // signature on top). That removes the double-signer bug but changes a failure
    // mode: jarsigner exited non-zero on a bad or empty password, whereas an
    // incomplete keystore here just leaves the build UNSIGNED and green — and
    // Play only rejects it at upload time, during a store swap. So CI sets this
    // flag whenever it INTENDED to sign, and a mismatch fails the build instead.
    def requireSigned = System.getenv("RELAY_REQUIRE_SIGNED") ?: project.findProperty("RELAY_REQUIRE_SIGNED")
    if (requireSigned?.toString() && !hasUploadKeystore) {
        throw new GradleException("RELAY_REQUIRE_SIGNED is set but the upload keystore is incomplete " +
                "(path=${ksPath ? 'set' : 'MISSING'}, password=${ksPassword ? 'set' : 'MISSING'}, " +
                "alias=${ksAlias ? 'set' : 'MISSING'}, " +
                "file=${ksFile?.isFile() ? ksFile.length() + 'B' : 'MISSING'})")
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKeystore) {
            release {
                storeFile ksFile          // already validated: absolute, non-empty
                storePassword ksPassword.toString()
                keyAlias ksAlias.toString()
                keyPassword ksKeyPassword.toString()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".next" // side-by-side with the current store app
            signingConfig signingConfigs.debug
        }
        release {
            // A real keystore when configured, otherwise UNSIGNED — never debug.
            signingConfig hasUploadKeystore ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Native call layer (M4): notifications + FCM wake-ups for incoming calls.
    // firebase-messaging is inert until google-services.json is added (the
    // module guards on FirebaseApp.getApps()) — see mobile/README.md Firebase.
    implementation("androidx.core:core:1.15.0")
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-messaging")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Apply the Google Services plugin ONLY when the Firebase config is present,
// so CI and Firebase-less checkouts keep building (FCM simply stays off).
def relayServicesJson = file('google-services.json')
if (relayServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("google-services.json not found — building WITHOUT FCM (rings-when-closed disabled).")
}
