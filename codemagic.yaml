workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.yourchat.relay
      vars:
        BUNDLE_ID: "io.yourchat.relay"
        APP_STORE_APP_ID: "6787503091"
        APPLE_TEAM_ID: "QJBVFFML9P"
        APP_STORE_CONNECT_ISSUER_ID: "c3d66b4c-bc5c-489b-bb85-3e712b5233e7"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "32NSHCFD69"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgKL1Z0yVuyr1piLDy
          JecFShYh5LOJSRXtMNoPsgMO5pKgCgYIKoZIzj0DAQehRANCAAR/c+cK9eMU/584
          kZdAHGgFCOPdnoxQnl0blQw5o40C8DNhv/PLYkfGd+w6wkWF3EGvWXjtuQjdNLN0
          WGPln6zB
          -----END PRIVATE KEY-----
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
      - name: Set up Expo
        script: |
          npx expo install --check
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "relaymobile.xcworkspace" \
            --scheme "relaymobile" \
            --config "Release"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
