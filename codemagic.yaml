workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile-main
          include: true
          source: true
    integrations:
      app_store_connect: Codemagic CI
    environment:
      ios_signing:
        provisioning_profiles:
          - profile: relay_appstore
        certificates:
          - certificate: relay-distribution
      vars:
        BUNDLE_ID: "com.app.relaymobile"
        APP_STORE_APP_ID: "6787503091"
        APPLE_TEAM_ID: "QJBVFFML9P"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          # Ensure we always increment past any previously uploaded version
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" -lt 10002 ]; then
            LATEST_BUILD_NUMBER=10002
          fi
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Setting build number to $NEW_BUILD_NUMBER (latest was $LATEST_BUILD_NUMBER)"
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          cd ios
          # Find the workspace dynamically
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"

          # Run xcodebuild directly to get full error output
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/ios/build/RELAY.xcarchive" \
            -destination "generic/platform=iOS" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_full.log

          ARCHIVE_EXIT=$?
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo "=== ARCHIVE FAILED (exit $ARCHIVE_EXIT) ==="
            echo "=== Last 200 lines of build log ==="
            tail -200 /tmp/xcodebuild_full.log
            exit $ARCHIVE_EXIT
          fi

          # If archive succeeded, export IPA
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/ios/build/RELAY.xcarchive" \
            -exportOptionsPlist ../exportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            2>&1 | tee -a /tmp/xcodebuild_full.log
      - name: Show build errors if failed
        script: |
          if [ -f /tmp/xcodebuild_full.log ]; then
            echo "=== ERRORS ==="
            grep -i "error:" /tmp/xcodebuild_full.log | head -50
            echo "=== WARNINGS ==="
            grep -i "warning:" /tmp/xcodebuild_full.log | head -20
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_full.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
