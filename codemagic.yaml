workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      ios_signing:
        provisioning_profiles:
          - profile: relay_appstore
        certificates:
          - certificate: relay-distribution
      vars:
        BUNDLE_ID: "com.app.relaymobile"
        APP_STORE_APP_ID: "6787503091"
        APPLE_TEAM_ID: "QJBVFFML9P"
      node: 22
      xcode: 26.0
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --export-options-plist "$CM_BUILD_DIR/export_options.plist"
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          FLOOR=10005
          NEXT=$(($LATEST_BUILD_NUMBER + 1))
          if [ $NEXT -le $FLOOR ]; then NEXT=$FLOOR; fi
          agvtool new-version -all $NEXT
      - name: Build ipa for distribution
        script: |
          cd ios
          # Find the workspace dynamically
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          
          # Run xcodebuild directly to get full error output
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/ios/build/RELAY.xcarchive" \
            -destination "generic/platform=iOS" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_full.log | tail -100
          
          # If archive succeeded, export IPA
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/ios/build/RELAY.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            2>&1 | tee -a /tmp/xcodebuild_full.log
      - name: Show build errors if failed
        script: |
          if [ -f /tmp/xcodebuild_full.log ]; then
            echo "=== ERRORS ==="
            grep -i "error:" /tmp/xcodebuild_full.log | head -50
            echo "=== WARNINGS ==="
            grep -i "warning:" /tmp/xcodebuild_full.log | head -20
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_full.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
