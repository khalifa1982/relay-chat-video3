<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>RELAY — Free Browser Voice & Video Calls</title>
    <meta name="description" content="Free browser voice, video, and chat calls. No installs, no accounts — pick a name, get a 6-digit number, and dial anyone instantly." />
    <meta name="keywords" content="browser calls, video call in browser, peer-to-peer calling, WebRTC phone, free video chat, voice call online" />
    <meta name="author" content="RELAY" />
    <meta name="robots" content="index, follow" />
    <!-- Self-canonical at runtime: one build serves every deployment domain
         (v2.92 R4B — no hardcoded origins), so the canonical URL is only
         knowable from location. og:url is deliberately absent for the same
         reason: scrapers fall back to the fetched URL, which is correct on
         every domain. -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.setAttribute("rel", "canonical");
        l.setAttribute("href", location.origin + location.pathname);
        document.head.appendChild(l);
      })();
    </script>
    <meta name="theme-color" content="#0a0d10" />
    <!-- PWA: installable, standalone, home-screen icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RELAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RELAY" />
    <meta property="og:title" content="RELAY — Free Browser Voice, Video & Chat Calls" />
    <meta property="og:description" content="Pick a name. Get a number. Dial anyone. RELAY is free peer-to-peer voice, video, and chat in the browser — no installs, no accounts." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RELAY — Free Browser Voice, Video & Chat Calls" />
    <meta name="twitter:description" content="Free peer-to-peer voice, video, and chat in your browser. No installs, no accounts — just a 6-digit number anyone can call." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RELAY",
        "description": "Free, self-hosted, peer-to-peer browser phone for voice calls, video calls, and chat. No installs, no accounts.",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires a modern browser with WebRTC support",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "keywords": "browser calls, video call in browser, peer-to-peer calling, WebRTC phone, free video chat, voice call online"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts (v2.88): the families the CALL SCREEN actually renders — Hanken
         Grotesk (engine body), Bricolage Grotesque (headings/buttons),
         JetBrains Mono (timer/keypad/PIN digits) — were referenced 36 times in
         relayAssets.ts but never loaded, so the flagship screen fell back to
         default serif. Instrument Serif / Space Grotesk / Space Mono stay for
         the /technology marketing page. Loaded NON-BLOCKING (media="print" →
         flips to all onload) so first paint never waits on Google Fonts;
         font-display:swap keeps text visible while binaries stream in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'" />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register the (no-op, install-enabling) service worker. Skipped on
         localhost so it never interferes with the Vite dev server / HMR. -->
    <script>
      if ("serviceWorker" in navigator &&
          location.hostname !== "localhost" &&
          location.hostname !== "127.0.0.1") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
