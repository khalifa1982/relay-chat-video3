name: vmcols
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: ssh peek
        env:
          PROG_B64: ""
        run: |
          mkdir -p ~/.ssh && printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s' "$PROG_B64" > /tmp/prog.b64
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/prog.b64 ubuntu@34.18.175.226:/tmp/prog.b64
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 '
            base64 -d /tmp/prog.b64 | sudo tee /home/relay/app/_peek_vm.mjs >/dev/null
            sudo chown relay:relay /home/relay/app/_peek_vm.mjs
            cd /home/relay/app && timeout 30 sudo -u relay node /home/relay/app/_peek_vm.mjs
            sudo rm -f /home/relay/app/_peek_vm.mjs /tmp/prog.b64'
