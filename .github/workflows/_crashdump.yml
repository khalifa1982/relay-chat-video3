name: crashdump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: read crashes
        env:
          KEY: ${{ secrets.DOHA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 '
            set -a; . /home/relay/.env; set +a
            cd /home/relay/app
            cat > /tmp/cr.mjs <<"JS"
import pg from "pg";
const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
await c.connect();
const r = await c.query("select fingerprint, count(*) n, max(created_at) last, (array_agg(message order by created_at desc))[1] msg, (array_agg(stack order by created_at desc))[1] stack, (array_agg(kind order by created_at desc))[1] kind, (array_agg(platform order by created_at desc))[1] platform from crash_reports where created_at > now() - interval \'30 days\' group by fingerprint order by n desc limit 25");
for (const row of r.rows) { console.log("═══", row.n+"×", row.kind, row.platform, "last="+row.last); console.log("MSG:", (row.msg||"").slice(0,300)); console.log("STACK:", (row.stack||"").slice(0,600)); console.log(); }
await c.end();
JS
            node /tmp/cr.mjs 2>&1 || echo "CRASH_QUERY_FAILED"
          '
