name: Switch Storage to GCS
on: {workflow_dispatch: {}}
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Rolling storage switch
        env:
          GCS_KEY: ${{ secrets.GCS_S3_ACCESS_KEY }}
          GCS_SECRET: ${{ secrets.GCS_S3_SECRET }}
        run: |
          cat > /tmp/upd.py <<'PYEOF'
          import os,shutil
          p="/home/relay/.env"
          keys=["S3_ENDPOINT","S3_BUCKET","S3_REGION","S3_ACCESS_KEY","S3_SECRET","AWS_REQUEST_CHECKSUM_CALCULATION","AWS_RESPONSE_CHECKSUM_VALIDATION"]
          nv={k:os.environ[k] for k in keys if os.environ.get(k)}
          shutil.copy(p,p+".bak-gcs")
          out=[]; seen=set()
          for l in open(p).read().splitlines():
              if "=" in l and not l.lstrip().startswith("#") and l.split("=",1)[0] in nv:
                  k=l.split("=",1)[0]; out.append(k+"="+nv[k]); seen.add(k)
              else: out.append(l)
          for k,v in nv.items():
              if k not in seen: out.append(k+"="+v)
          open(p,"w").write("\n".join(out)+"\n")
          print("switched keys:",",".join(nv))
          PYEOF
          E="S3_ENDPOINT=https://storage.googleapis.com S3_BUCKET=relay-uploads-541732683953 S3_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED"
          switch() {
            H=$1
            scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/upd.py ubuntu@$H:/tmp/upd.py
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@$H "sudo -u relay env $E S3_ACCESS_KEY=\"$GCS_KEY\" S3_SECRET=\"$GCS_SECRET\" python3 /tmp/upd.py && sudo -u relay bash -lc 'cd /home/relay/app && set -a && . /home/relay/.env && set +a && pm2 restart relay --update-env && pm2 save' && sleep 3 && (sudo -u relay pm2 logs relay --lines 50 --nostream 2>/dev/null | grep -iE 'signature|checksum|denied|s3 |storage error|econnrefused' | tail -8 || true)"
            for i in $(seq 1 12); do code=$(curl -s -o /dev/null -m8 -w '%{http_code}' --resolve your-chat.io:443:$H https://your-chat.io/api/health || echo 000); [ "$code" = "200" ] && { echo "$H HEALTHY"; return 0; }; sleep 4; done
            echo "$H FAILED HEALTH"; return 1
          }
          set -e
          switch 34.18.175.226
          switch 34.18.145.249
          echo "STORAGE SWITCHED + HEALTHY ON BOTH"
