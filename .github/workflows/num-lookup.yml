name: Number Lookup
on: {workflow_dispatch: {}}
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: q
        run: |
          mkdir -p ~/.ssh; printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          echo "" | base64 -d > /tmp/v.sh
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@34.18.175.226 'bash -s' < /tmp/v.sh
