# Builds the RELAY Android app (mobile/android — a Trusted Web Activity shell
# around the live web app) and publishes the binaries as workflow artifacts:
#   • app-debug.apk            — debug-signed: install directly on any device
#                                 for testing (adb install / download + open)
#   • app-release-unsigned.apk — release APK awaiting YOUR signature
#   • app-release.aab          — the bundle you sign + upload to Google Play
#
# Runs on demand (Actions tab → "Android APK" → Run workflow) and whenever the
# Android project changes on main. GitHub's ubuntu runners ship the Android
# SDK preinstalled; Gradle is pinned below.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK + release APK/AAB
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-release-apk-unsigned
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Play Store bundle (AAB, unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ── Optional: produce a READY-TO-UPLOAD signed bundle ────────────────
      # Add these repository secrets (Settings → Secrets and variables →
      # Actions) and every run also emits RELAY-release-aab-SIGNED:
      #   ANDROID_KEYSTORE_BASE64   — `base64 -w0 relay-upload.keystore`
      #   ANDROID_KEYSTORE_PASSWORD — keystore password
      #   ANDROID_KEY_ALIAS         — key alias (e.g. relay)
      #   ANDROID_KEY_PASSWORD      — key password (omit if same as keystore)
      # Without the secrets this step prints a note and the run stays green.
      - name: Sign Play bundle (when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping signing (see workflow comments / mobile/README.md §3.2)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/upload.keystore
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab /tmp/RELAY-release-signed.aab
          jarsigner \
            -keystore /tmp/upload.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            /tmp/RELAY-release-signed.aab "$KEY_ALIAS"
          jarsigner -verify /tmp/RELAY-release-signed.aab
          echo "Signed bundle ready."

      - name: Upload SIGNED Play bundle (only when signing ran)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-release-aab-SIGNED
          path: /tmp/RELAY-release-signed.aab
          if-no-files-found: ignore
