name: Doha Diagnostic
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TURN + app config
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "########## turn3 (34.18.228.53) coturn ##########"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@34.18.228.53 '
            echo "--- turnserver.conf (secret masked) ---"
            sudo grep -vE "^\s*#|^\s*$" /etc/turnserver.conf 2>/dev/null | sed -E "s/(static-auth-secret=).*/\1<SECRET>/"
            echo "--- listening ports ---"
            sudo ss -ulnp 2>/dev/null | grep -iE "turn|3478|5349" | awk "{print \$1,\$5}" | sort -u
            sudo ss -tlnp 2>/dev/null | grep -iE "turn|3478|5349|:443" | awk "{print \$1,\$5}" | sort -u
            echo "--- version + certs ---"; turnserver --version 2>/dev/null | head -1
            grep -iE "cert=|pkey=|tls-listening|external-ip|realm|listening-ip|min-port|max-port" /etc/turnserver.conf 2>/dev/null | sed -E "s/(secret=).*/\1<SECRET>/"
          ' || echo "turn3 SSH failed"
          echo
          echo "########## app TURN env (34.18.175.226) ##########"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@34.18.175.226 '
            sudo -u relay grep -iE "^TURN|^ICE|^STUN" /home/relay/.env | sed -E "s/(SECRET=).*/\1<SECRET>/"
          ' || echo "app SSH failed"
