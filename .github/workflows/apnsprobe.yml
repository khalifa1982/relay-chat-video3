name: apnsprobe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
          PROG: ""
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          H=34.18.175.226
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@$H "echo $PROG | base64 -d > /tmp/apnsprobe.ts && sudo cp /tmp/apnsprobe.ts /home/relay/app/_apnsprobe.ts && sudo chown relay:relay /home/relay/app/_apnsprobe.ts && sudo -u relay bash -c 'cd /home/relay/app && ./node_modules/.bin/tsx _apnsprobe.ts 2>&1' ; sudo rm -f /home/relay/app/_apnsprobe.ts"
