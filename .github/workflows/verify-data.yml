name: Verify Data
on: {workflow_dispatch: {}}
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: count rows in Cloud SQL Doha
        run: |
          mkdir -p ~/.ssh; printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@34.18.175.226 'sudo -u relay bash -lc "
            cd /home/relay
            DBURL=\$(grep -E \"^DATABASE_URL=\" .env | cut -d= -f2- | tr -d \\\"\\\x27\\\")
            if [ -n \"\$DBURL\" ]; then
              pr=\${DBURL#*://}; cr=\${pr%@*}; hp=\${pr#*@}
              U=\${cr%%:*}; P=\${cr#*:}; HPT=\${hp%%/*}; DBN=\${hp#*/}; DBN=\${DBN%%\?*}
              HOST=\${HPT%%:*}; PORT=\${HPT#*:}; [ \"\$PORT\" = \"\$HOST\" ] && PORT=3306
            else
              HOST=\$(grep -E \"^DB_HOST=\" .env|cut -d= -f2-); U=\$(grep -E \"^DB_USER=\" .env|cut -d= -f2-)
              P=\$(grep -E \"^DB_PASS(WORD)?=\" .env|head -1|cut -d= -f2-); DBN=\$(grep -E \"^DB_(NAME|DATABASE)=\" .env|head -1|cut -d= -f2-)
              PORT=\$(grep -E \"^DB_PORT=\" .env|cut -d= -f2-); PORT=\${PORT:-3306}
            fi
            echo \"DB host=\$HOST port=\$PORT db=\$DBN (user/pass hidden)\"
            which mysql >/dev/null 2>&1 || sudo apt-get install -y mysql-client-core-8.0 >/dev/null 2>&1
            mysql -h \"\$HOST\" -P \"\$PORT\" -u \"\$U\" -p\"\$P\" \"\$DBN\" -N -e \"
              SELECT CONCAT('TOTAL TABLES: ',COUNT(*)) FROM information_schema.tables WHERE table_schema=DATABASE();
              SELECT CONCAT(table_name,' => ',IFNULL(table_rows,0),' rows') FROM information_schema.tables WHERE table_schema=DATABASE() ORDER BY table_rows DESC LIMIT 14;\" 2>&1 | grep -vi warning
          "'
