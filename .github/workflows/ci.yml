name: CI

on:
  # `web-app-main` is the web app's mainline (owner, 2026-08-01); `main` carries
  # the Expo mobile project. Both are listed so this keeps working whichever way
  # the two-repo split lands, and so PRs targeting the web mainline get CI —
  # `pull_request` workflows are read from the BASE branch, so a PR into a branch
  # that is not listed here queues no checks at all.
  #
  # READ THE COUNT, NOT THE COLOUR. On PR #138 `get_status` answered `pending`
  # with `total_count: 0` — no check had been *reported*, which is not the same
  # thing as a check failing, and the two are indistinguishable if you only look
  # for something red. A PR with zero checks is not a passing PR.
  #
  # When that happens, distinguish a TRIGGER problem from an ACTIONS problem
  # before editing this file, because they look identical from the PR page:
  #   - trigger problem  → a run object exists for some other ref but not yours,
  #                        or the base branch's copy of this file omits the base
  #                        (see the note above — `pull_request` reads the BASE).
  #   - Actions problem  → the repo-wide run count does not move at all for ANY
  #                        event. On #138 it sat at 979 across a fresh push to an
  #                        open PR's head, i.e. no run was ever created. That is
  #                        repo/account level — Actions disabled, a spending cap,
  #                        or a GitHub incident — and nothing in this file fixes it.
  # `list_workflow_runs` unfiltered, comparing `total_count` before and after, is
  # what tells the two apart in one call.
  push:
    branches: [main, master, web-app-main]
  pull_request:
    branches: [main, master, web-app-main]

# Cancel in-flight CI runs when a new commit is pushed to the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Do NOT pin the version here — package.json's `packageManager` field is
      # the single source of truth. pnpm/action-setup@v4 errors out
      # (ERR_PNPM_BAD_PM_VERSION) if a version is specified in BOTH places.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build (sanity)
        # We don't ship the build artifact from CI — Manus builds at deploy time.
        # This step just catches build-time errors (e.g. broken imports, bad Vite config) early.
        run: pnpm build
        env:
          # Provide dummy values for VITE_* envs so the production build doesn't fail on missing required ones.
          # Real values are injected by Manus at deploy time.
          VITE_APP_ID: ci-dummy
          VITE_APP_TITLE: RELAY
          VITE_OAUTH_PORTAL_URL: https://example.com/oauth
          VITE_FRONTEND_FORGE_API_URL: https://example.com/forge
          VITE_FRONTEND_FORGE_API_KEY: ci-dummy
          VITE_ANALYTICS_ENDPOINT: https://example.com/analytics
          VITE_ANALYTICS_WEBSITE_ID: ci-dummy
