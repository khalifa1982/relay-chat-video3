name: fcminstall
on: { workflow_dispatch: {} }
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
          FB_B64: ""
          INST_B64: ""
          PROBE_B64: ""
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$FB_B64" | base64 -d > /tmp/firebase-sa.json
          echo "$INST_B64" | base64 -d > /tmp/install.sh
          echo "$PROBE_B64" | base64 -d > /tmp/fcmprobe.ts
          for H in 34.18.175.226 34.18.145.249; do
            echo "==== box $H ===="
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/firebase-sa.json /tmp/install.sh ubuntu@$H:/tmp/
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@$H 'bash /tmp/install.sh; rm -f /tmp/firebase-sa.json /tmp/install.sh'
            sleep 8
          done
          echo "==== verify FCM on box A ===="
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/fcmprobe.ts ubuntu@34.18.175.226:/tmp/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 'sudo cp /tmp/fcmprobe.ts /home/relay/app/_fcmprobe.ts && sudo chown relay:relay /home/relay/app/_fcmprobe.ts && sudo -u relay bash -c "cd /home/relay/app && ./node_modules/.bin/tsx _fcmprobe.ts 2>&1"; sudo rm -f /home/relay/app/_fcmprobe.ts /tmp/fcmprobe.ts'
