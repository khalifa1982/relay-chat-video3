name: Build Media Doha
on: {workflow_dispatch: {}}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: web-app-main}
      - name: deploy media nodes
        run: |
          mkdir -p ~/.ssh; printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          echo "" | base64 -d > /tmp/r.sh
          bash /tmp/r.sh
