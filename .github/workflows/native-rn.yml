# Builds the RELAY NATIVE REWRITE (mobile/native — compiled React Native, no
# webview). Milestone builds install side-by-side with the store app (debug
# applicationId org.yourchat.relay.next).
name: Native app (React Native)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/native/**"
      - ".github/workflows/native-rn.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        working-directory: mobile/native
        run: npm ci

      - name: Build debug APK + release APK + release AAB
        working-directory: mobile/native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK (installable — Milestone build)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-debug-apk
          path: mobile/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Production-behavior build: no dev support, JS embedded, package
      # org.yourchat.relay.
      #
      # NOTE (v2.99.53): since v2.99.52 this APK is UNSIGNED unless a real
      # keystore is configured (it must never be signed with the debug key — see
      # mobile/native/android/app/build.gradle). An unsigned APK CANNOT be
      # installed on a device, so for the QA-TEST-PLAN §F device pass use the
      # RELAY-RN-debug-apk artifact above (installs side-by-side as
      # org.yourchat.relay.next), or set the RELAY_KEYSTORE_* properties to get a
      # properly signed release build. This artifact is kept for inspection and
      # for signing with the upload key.
      - name: Upload release APK (production-behavior test build)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-release-apk
          # GLOB, deliberately (v2.99.53): AGP names the output
          # `app-release-unsigned.apk` when the release build type has no signing
          # config, and `app-release.apk` when it does. Since v2.99.52 the release
          # build is UNSIGNED unless a real keystore is configured — it must never
          # fall back to the debug key — so a hardcoded signed filename made this
          # step fail with `if-no-files-found: error` even though the Gradle build
          # succeeded. The glob matches whichever name the build actually produced.
          path: mobile/native/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Upload release AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-release-aab
          path: mobile/native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ── M6: READY-TO-UPLOAD signed bundle for the STORE SWAP ─────────────
      # Same secrets as android-apk.yml (mobile/README.md §3.2). The RN app
      # shares applicationId org.yourchat.relay, so this AAB uploads straight
      # to the EXISTING Play listing as the next release. Without the secrets
      # the step prints a note and the run stays green.
      - name: Sign Play bundle (when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping signing (see mobile/README.md §3.2)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/upload.keystore
          cp mobile/native/android/app/build/outputs/bundle/release/app-release.aab /tmp/RELAY-RN-release-signed.aab
          jarsigner -keystore /tmp/upload.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            /tmp/RELAY-RN-release-signed.aab "$KEY_ALIAS"
          echo "Signed RN bundle ready."

      - name: Upload SIGNED Play bundle (only when signing ran)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-release-aab-SIGNED
          path: /tmp/RELAY-RN-release-signed.aab
          if-no-files-found: ignore
