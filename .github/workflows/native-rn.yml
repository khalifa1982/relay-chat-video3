# Builds the RELAY NATIVE REWRITE (mobile/native — compiled React Native, no
# webview). Milestone builds install side-by-side with the store app (debug
# applicationId org.yourchat.relay.next).
name: Native app (React Native)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/native/**"
      - ".github/workflows/native-rn.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        working-directory: mobile/native
        run: npm ci

      - name: Build debug APK + release AAB
        working-directory: mobile/native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload debug APK (installable — Milestone build)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-debug-apk
          path: mobile/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: RELAY-RN-release-aab
          path: mobile/native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
