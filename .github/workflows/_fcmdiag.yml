name: _fcmdiag
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: crashdump
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
        run: |
          set -e
          printf '%s\n' "$SSH_KEY" > /tmp/k && chmod 600 /tmp/k
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/k ubuntu@34.18.175.226 'bash -lc "
            cd /home/relay/app
            set -a; . /home/relay/.env; set +a
            cat > /tmp/cr.cjs <<\"JS\"
            const mysql = require(\"mysql2/promise\");
            (async () => {
              const u = new URL(process.env.DATABASE_URL);
              const c = await mysql.createConnection({
                host: u.hostname, port: u.port||3306,
                user: decodeURIComponent(u.username), password: decodeURIComponent(u.password),
                database: u.pathname.slice(1), ssl: { rejectUnauthorized: false }
              });
              const [tot] = await c.query(\"SELECT COUNT(*) n, MIN(createdAt) first, MAX(createdAt) last FROM \x60crash_reports\x60\");
              console.log(\"TOTAL_ROWS: \" + tot[0].n + \"  span \" + tot[0].first + \" .. \" + tot[0].last);
              const [rows] = await c.query(
                \"SELECT \x60fingerprint\x60 fp, COUNT(*) n, SUM(\x60dupCount\x60) hits, MAX(\x60createdAt\x60) last, \" +
                \"SUBSTRING_INDEX(GROUP_CONCAT(\x60errorName\x60 ORDER BY \x60createdAt\x60 DESC SEPARATOR 0x1e),0x1e,1) name, \" +
                \"SUBSTRING_INDEX(GROUP_CONCAT(\x60errorMessage\x60 ORDER BY \x60createdAt\x60 DESC SEPARATOR 0x1e),0x1e,1) msg, \" +
                \"SUBSTRING_INDEX(GROUP_CONCAT(\x60platform\x60 ORDER BY \x60createdAt\x60 DESC SEPARATOR 0x1e),0x1e,1) plat, \" +
                \"SUBSTRING_INDEX(GROUP_CONCAT(COALESCE(\x60appVersion\x60,0x3f) ORDER BY \x60createdAt\x60 DESC SEPARATOR 0x1e),0x1e,1) ver, \" +
                \"SUBSTRING_INDEX(GROUP_CONCAT(COALESCE(\x60stack\x60,0x20) ORDER BY \x60createdAt\x60 DESC SEPARATOR 0x1e),0x1e,1) stk \" +
                \"FROM \x60crash_reports\x60 WHERE \x60createdAt\x60 > NOW() - INTERVAL 30 DAY GROUP BY \x60fingerprint\x60 ORDER BY hits DESC LIMIT 25\"
              );
              if (!rows.length) console.log(\"NO_CRASHES_30D\");
              for (const r of rows) {
                console.log(\"=== \" + r.hits + \"x  \" + r.plat + \"  v\" + r.ver + \"  last=\" + r.last);
                console.log(\"NAME: \" + r.name);
                console.log(\"MSG:  \" + String(r.msg||\"\").slice(0,220));
                console.log(\"STK:  \" + String(r.stk||\"\").split(String.fromCharCode(10)).slice(0,4).join(\"  |  \").slice(0,420));
                console.log(\"\");
              }
              await c.end();
            })().catch(e => { console.log(\"CRASH_QUERY_ERR: \" + e.message); process.exit(0); });
JS
            node /tmp/cr.cjs 2>&1 || echo NODE_RUN_FAILED
          "'
