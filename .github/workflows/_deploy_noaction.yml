name: _deploy_noaction
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rolling deploy without external actions
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Plain git clone — avoids the actions/checkout resolution service
          git clone --depth 1 --branch web-app-main https://github.com/khalifa1982/relay-chat-video3.git src
          cd src
          echo "=== deploying commit $(git rev-parse --short HEAD)"

          deploy() {
            H=$1
            echo "=== deploying $H"
            rsync -az --exclude node_modules --exclude .git --exclude .env -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" ./ ubuntu@$H:/tmp/deploy-src/
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@$H 'sudo rsync -a --exclude node_modules --exclude .env /tmp/deploy-src/ /home/relay/app/ && sudo chown -R relay:relay /home/relay/app && sudo -u relay bash -lc "cd /home/relay/app && (if [ -d dist/assets ]; then rm -rf ../assets_prev && cp -r dist/assets ../assets_prev; fi) && npm ci --no-audit --no-fund --legacy-peer-deps --include=dev && npm run build && (if [ -d ../assets_prev ]; then cp -rn ../assets_prev/. dist/assets/ 2>/dev/null || true; fi) && set -a && . /home/relay/.env && set +a && pm2 restart relay --update-env && pm2 save"'
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -m 8 -w "%{http_code}" --resolve your-chat.io:443:$H https://your-chat.io/api/health || echo 000)
              [ "$code" = "200" ] && { echo "$H healthy"; return 0; }
              sleep 4
            done
            echo "$H FAILED health after deploy"; return 1
          }

          deploy 34.18.175.226
          deploy 34.18.145.249
          echo "ALL DEPLOYED + HEALTHY"
