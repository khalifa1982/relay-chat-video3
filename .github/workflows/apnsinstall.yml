name: apnsinstall
on: { workflow_dispatch: {} }
jobs:
  ins:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
          P8_B64: ""
          INST_B64: ""
          VER_B64: ""
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$P8_B64" | base64 -d > /tmp/apns.p8
          echo "$INST_B64" | base64 -d > /tmp/apnsinstall.sh
          echo "$VER_B64" | base64 -d > /tmp/apnsverify.ts
          for H in 34.18.175.226 34.18.145.249; do
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/apns.p8 /tmp/apnsinstall.sh ubuntu@$H:/tmp/
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@$H 'bash /tmp/apnsinstall.sh; rm -f /tmp/apns.p8 /tmp/apnsinstall.sh'
            sleep 8
          done
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/apnsverify.ts ubuntu@34.18.175.226:/tmp/
          echo "<<<VERIFY"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 'sudo cp /tmp/apnsverify.ts /home/relay/app/_av.ts && sudo chown relay:relay /home/relay/app/_av.ts && sudo -u relay bash -c "cd /home/relay/app && ./node_modules/.bin/tsx _av.ts 2>&1"; sudo rm -f /home/relay/app/_av.ts /tmp/apnsverify.ts'
          echo "VERIFY>>>"
