name: _probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
        run: |
          set -e
          printf '%s\n' "$SSH_KEY" > /tmp/k && chmod 600 /tmp/k
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/k ubuntu@34.18.175.226 "echo '' | base64 -d | bash"
