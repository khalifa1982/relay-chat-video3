name: fcmdbg
on: { workflow_dispatch: {} }
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
          DBG_B64: ""
          DBG2_B64: ""
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$DBG_B64" | base64 -d > /tmp/dbg.sh
          echo "$DBG2_B64" | base64 -d > /tmp/dbg2.ts
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/dbg.sh /tmp/dbg2.ts ubuntu@34.18.175.226:/tmp/
          echo "<<<SEC1"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 'bash /tmp/dbg.sh'
          echo "SEC1>>>"
          echo "<<<SEC2"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 'sudo cp /tmp/dbg2.ts /home/relay/app/_dbg2.ts && sudo chown relay:relay /home/relay/app/_dbg2.ts && sudo -u relay bash -c "cd /home/relay/app && ./node_modules/.bin/tsx _dbg2.ts 2>&1"; sudo rm -f /home/relay/app/_dbg2.ts /tmp/dbg2.ts /tmp/dbg.sh'
          echo "SEC2>>>"
