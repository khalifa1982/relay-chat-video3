name: Verify TURN
on: {workflow_dispatch: {}}
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: functional TURN test of turn4
        env:
          TS: ${{ secrets.TURN_SECRET }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y coturn >/dev/null 2>&1
          IP=34.18.203.22
          echo "===== daemon check on turn4 ====="
          mkdir -p ~/.ssh; printf '%s' "${{ secrets.DOHA_SSH_KEY }}" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 ubuntu@$IP 'echo coturn=$(sudo systemctl is-active coturn); sudo ss -ulnp 2>/dev/null | grep -o "0.0.0.0:3478" | head -1; grep external-ip /etc/turnserver.conf' || echo "(ssh to turn4 not ready yet)"
          echo "===== STUN binding test (UDP reachability) ====="
          turnutils_stunclient $IP 2>&1 | grep -iE 'response|mapped|error|timeout' | head -5 || true
          echo "===== TURN allocation test (auth + relay) ====="
          U=$(( $(date +%s) + 3600 ))
          P=$(printf '%s' "$U" | openssl dgst -sha1 -hmac "$TS" -binary | base64)
          timeout 25 turnutils_uclient -u "$U" -w "$P" -n 2 -y $IP 2>&1 | grep -iE 'allocate|success|error|401|403|relay|total|lost|cannot|timeout' | head -12 || true
