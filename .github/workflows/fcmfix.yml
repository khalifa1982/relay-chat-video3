name: fcmfix
on: { workflow_dispatch: {} }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          SSH_KEY: ${{ secrets.DOHA_SSH_KEY }}
          FIX_B64: ""
          PROBE_B64: ""
          KID_B64: ""
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$FIX_B64" | base64 -d > /tmp/fix.sh
          echo "$PROBE_B64" | base64 -d > /tmp/fcmprobe.ts
          echo "$KID_B64" | base64 -d > /tmp/keyid.sh
          for H in 34.18.175.226 34.18.145.249; do
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/fix.sh ubuntu@$H:/tmp/
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@$H 'bash /tmp/fix.sh; rm -f /tmp/fix.sh'
            sleep 8
          done
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id /tmp/fcmprobe.ts /tmp/keyid.sh ubuntu@34.18.175.226:/tmp/
          echo "<<<VERIFY"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id ubuntu@34.18.175.226 'sudo cp /tmp/fcmprobe.ts /home/relay/app/_p.ts && sudo chown relay:relay /home/relay/app/_p.ts && sudo -u relay bash -c "cd /home/relay/app && ./node_modules/.bin/tsx _p.ts 2>&1"; sudo rm -f /home/relay/app/_p.ts; bash /tmp/keyid.sh; rm -f /tmp/fcmprobe.ts /tmp/keyid.sh'
          echo "VERIFY>>>"
